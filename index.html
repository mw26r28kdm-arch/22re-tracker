 const veh=G.vehicles.find(v=>v.id===vid),secT=g("sec").value.trim()||"Added tasks",done=g("status").value==="complete",cost=g("cost").value.trim();
 set(()=>{let s=veh.sections.find(x=>x.title===secT);if(!s){s={title:secT,items:[]};veh.sections.push(s)}const id="t-"+Date.now();
  s.items.push({id,label,checked:done,notes:"",part:"",cost,updated:today()});veh.log.push({date:today(),itemId:id,item:label,action:done?"Completed (added)":"Task added",part:"",cost:parseFloat(cost)||0})});

 const veh=d.vehicleId&&G.vehicles.find(v=>v.id===d.vehicleId)||V();
 const arr=Array.isArray(d)?d:Array.isArray(d.entries)?d.entries:(d.sections||d.cases||d.tests)?[]:[d];
 set(()=>{if(d.sections&&d.log){veh.sections=d.sections;veh.log=d.log;veh.cases=d.cases&&d.cases.length?d.cases:veh.cases;veh.tests=d.tests||[];if(d.info)veh.info={...veh.info,...d.info}}else{
  if(d.sections)veh.sections=d.sections.map(s=>({title:s.title,items:s.items.map(it=>({id:it.id,label:it.label,checked:!!it.checked,notes:it.notes||"",part:it.part||"",cost:it.cost?String(it.cost):"",updated:""}))}));

   else if(it){if(e.checked!=null)it.checked=e.checked;if(e.notes!=null)it.notes=e.notes;if(e.part!=null)it.part=e.part;if(e.cost!=null)it.cost=String(e.cost);it.updated=e.date||today()}
   tv.log.push({date:e.date||today(),itemId:id,item:e.label||e.item||id,action:e.action||(e.checked?"Completed":"Imported"),part:e.part||"",cost:parseFloat(e.cost)||0})})});
 toast("Imported into "+vName(veh))}

function openItem(vid,id){G.activeVehicleId=vid;go("checklist");const el=document.getElementById("item-"+id);if(el){el.scrollIntoView({block:"center"});const i=el.querySelector("input.notes");i&&i.focus({preventScroll:true})}}
function viewLog(){const v=V();let r=0;const rows=[...v.log].sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="stats"><div class="stat"><b>${v.log.length}</b><span>Entries</span></div><div class="stat"><b>${money(vSpent(v))}</b><span>Total spent</span></div><div class="stat"><b>${rows.length?rows[rows.length-1].date.slice(5):"—"}</b><span>Last entry</span></div></div>
 <section class="card"><div class="card-h"><h2>History</h2><span class="meta">${esc(vName(v))}</span></div><div class="card-b flush">`+(rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Item</th><th class="num">Cost</th><th class="num">Running</th></tr></thead><tbody>`+rows.map(l=>{r+=l.cost||0;return `<tr><td class="num">${l.date}</td><td><b>${esc(l.item)}</b><div class="sub">${esc(l.action)}${l.part?" · Part "+esc(l.part):""}</div></td><td class="num">${l.cost?money(l.cost):""}</td><td class="num">${money(r)}</td></tr>`}).join("")+`</tbody></table></div>`:`<div class="card-b sub">Entries appear when you check an item, add a note, part or cost, or log work below.</div>`)+`</div></section>
 <section class="card"><div class="card-h"><h2>Add log entry</h2></div><div class="card-b"><div class="form">
 <label class="field full"><span>Vehicle (required)</span>${vehSelect("alveh",v.id)}</label>
 <label class="field"><span>Date</span><input class="input" type="date" id="aldate" value="${today()}"></label>
 <label class="field"><span>Cost ($)</span><input class="input" id="alcost" inputmode="decimal"></label>
 <label class="field full"><span>Item / work done</span><input class="input" id="alitem" placeholder="e.g. Oil and filter change"></label>
 <label class="field"><span>Action</span><input class="input" id="alaction" placeholder="Completed"></label>
 <label class="field"><span>Part #</span><input class="input" id="alpart"></label>
 <div class="field full"><div class="err" id="alerr" role="alert"></div><div class="actions"><button class="btn primary" onclick="addLog()">Save entry</button></div></div></div></div></section>`}
function viewDiag(){const v=V(),cur=curCase();
 const picker=`<section class="card"><div class="card-h"><h2>Cases</h2><span class="meta">${v.cases.length}</span></div><div class="card-b"><div class="form">
 ${v.cases.length?`<label class="field full"><span>Current case</span><select class="input" onchange="caseId=this.value;render()">${v.cases.map(c=>`<option value="${c.id}" ${cur&&c.id===cur.id?"selected":""}>${c.opened} · ${esc(c.title)}</option>`).join("")}</select></label>`:""}
 <label class="field full"><span>New case: pick a symptom</span><select class="input" onchange="query=symById(this.value).name;render()"><option value="">Choose…</option>${LIB.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label>
 <label class="field full"><span>…or describe it</span><input class="input" id="q" placeholder="e.g. dies when hot" value="${esc(query)}" oninput="query=this.value" onkeydown="if(event.key==='Enter')openCase()"></label>
 <div class="field full"><div class="actions"><button class="btn primary" onclick="openCase()">Open new case</button></div></div></div>
 ${v.is22re&&/\biac\b|idle air control/i.test(query+" "+(cur?cur.title:""))?`<div class="note">${IAC_NOTE}</div>`:""}</div></section>`;
 if(!cur)return picker;const sym=symById(cur.symptomId),ts=v.tests.filter(t=>t.caseId===cur.id);
 return picker+`<section class="card"><div class="card-h"><h2>Root cause map</h2><span class="meta">${esc(sym.name)}</span></div><div class="card-b">
 <div class="head"><span>Symptom · opened ${cur.opened}</span>${esc(cur.title)}<div class="sub" style="font-weight:400;margin-top:4px">${esc(cur.notes)}</div></div>
 <p class="sub" style="margin:8px 0 12px">Tap a culprit to prefill a test. Tap its tag to cycle suspect, ruled out, confirmed. Specs marked "verify" must be checked against the service manual or underhood label.</p>
 <div class="fb">`+sym.branches.map(([sys,cs])=>`<div class="branch"><h4>${esc(v.is22re?sys:sys.replace(" (no electronic IAC on 22RE)",""))}</h4>`+cs.map(([n,t])=>{const m=(cur.marks||{})[n]||"",cl=m==="ruled out"?"ruled":m;return `<div class="culprit ${cl}"><div class="culprit-top"><button class="linkish" data-n="${esc(n)}" data-t="${esc(t)}" onclick="draft.culprit=this.dataset.n;draft.test=this.dataset.t;render();document.getElementById('dResult').focus()">${esc(n)}</button><button class="tag ${cl}" data-n="${esc(n)}" onclick="mark(this.dataset.n)">${m||"untested"}</button></div><div class="sub">${esc(t)}</div></div>`}).join("")+`</div>`).join("")+`</div></div></section>
 <section class="card"><div class="card-h"><h2>What I tested</h2><span class="meta">${ts.length}</span></div><div class="card-b"><div class="form">
 <label class="field"><span>Culprit</span><input class="input" value="${esc(draft.culprit)}" oninput="draft.culprit=this.value"></label>
 <label class="field"><span>Outcome</span><select class="input" onchange="draft.outcome=this.value">${["pass","fail","inconclusive"].map(o=>`<option ${o===draft.outcome?"selected":""}>${o}</option>`).join("")}</select></label>
 <label class="field full"><span>Test done</span><input class="input" value="${esc(draft.test)}" oninput="draft.test=this.value"></label>
 <label class="field full"><span>Result / finding</span><input class="input" id="dResult" value="${esc(draft.result)}" oninput="draft.result=this.value"></label>
 <label class="field full"><span>Notes</span><input class="input" value="${esc(draft.notes)}" oninput="draft.notes=this.value"></label>
 <div class="field full"><div class="actions"><button class="btn primary" onclick="addTest()">Log test</button></div></div></div></div>${ts.length?`<div style="border-top:1px solid var(--border)">${ttable(v,ts,false)}</div>`:""}</section>`+
 (v.tests.length?`<section class="card"><div class="card-h"><h2>Diagnostic history</h2><span class="meta">${esc(vName(v))}</span></div>${ttable(v,v.tests,true)}</section>`:"")}
function viewIO(){return `<section class="card"><div class="card-h"><h2>Export</h2></div><div class="card-b"><p class="sub" style="margin-top:0">Data lives on this device. Export regularly as a backup.</p><div class="actions">
 <button class="btn" onclick="setIO(exportVehicle())">Show active vehicle JSON</button><button class="btn" onclick="setIO(exportGarage())">Show garage JSON</button>
 <button class="btn primary" onclick="dl(exportGarage(),'garage-backup-'+today()+'.json')">Download garage backup</button><button class="btn" onclick="dl(exportVehicle(),'vehicle-'+V().id+'-'+today()+'.json')">Download active vehicle</button></div></div></section>
 <section class="card"><div class="card-h"><h2>Import</h2><span class="meta">Into ${esc(vName(V()))}</span></div><div class="card-b"><p class="sub" style="margin-top:0">Paste a garage backup (replaces the garage), a single-vehicle or old single-truck export, or entries from the assistant. Entries without a vehicleId go to the active vehicle.</p>
 <textarea class="input" id="io" rows="8" style="font-family:var(--mono);font-size:13px">${esc(ioText)}</textarea><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="doImport(document.getElementById('io').value)">Import</button></div></div></section>
 <section class="card"><div class="card-h"><h2>Reset</h2></div><div class="card-b"><p class="sub" style="margin-top:0">Resets the active vehicle's checklist, log and diagnostics to its starter template.</p><button class="btn danger" onclick="if(confirm('Reset '+vName(V())+' to its starter list?'))set(()=>{const v=V();v.sections=mkSections(v.is22re?RAW:GENERIC_RAW);v.log=[];v.tests=[];v.cases=v.is22re?[{...SEED_CASE,marks:{}}]:[]})">Reset active vehicle</button></div></section>`}
function viewAbout(){return `<section class="card"><div class="card-h"><h2>About</h2></div><div class="card-b"><p style="margin-top:0">Garage Tracker keeps checklists, a dated maintenance log and diagnostic cases per vehicle. It works offline and stores data on this device only.</p><p class="sub">Specs marked "verify" should be checked against the factory service manual or underhood emissions label. Build garage-v2.</p></div></section>`}
function render(){const v=V(),t=(VIEWS.find(x=>x[0]===G.ui.view)||VIEWS[0]);if(!VIEWS.some(x=>x[0]===G.ui.view))G.ui.view="garage";
 document.getElementById("viewTitle").textContent=t[1];document.getElementById("vehChip").textContent=vName(v);document.title=t[1]+" · Garage Tracker";
 document.getElementById("nav").innerHTML=navHTML();
 const f={garage:viewGarage,checklist:viewChecklist,tasks:viewTasks,log:viewLog,diag:viewDiag,io:viewIO,about:viewAbout}[t[0]];document.getElementById("app").innerHTML=f()}
(async()=>{try{await idb();let s=await load();if(!s){try{const ls=localStorage.getItem("toyota22re-tracker-v1");if(ls)s=JSON.parse(ls)}catch(e){}}G=migrate(s);save();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){toast("Storage unavailable; use Export")}render()})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
