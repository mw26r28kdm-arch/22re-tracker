.item-label{flex:1;padding-top:2px}.done .item-label{color:var(--text3);text-decoration:line-through}

.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:420px){.form{grid-template-columns:1fr}.stats b{font-size:18px}}

function openCase(){if(!query.trim())return;const s=match(query),id="case-"+Date.now();set(()=>{V().cases.push({id,symptomId:s.id,title:query.trim(),opened:today(),notes:s.id==="generic"?"No close match; showing all-systems fishbone.":"Matched: "+s.name,marks:{}});caseId=id;query=""})}
function addTest(){if(!draft.culprit&&!draft.result)return toast("Add a culprit or result first");const c=curCase();if(!c)return;set(()=>{V().tests.push({...draft,date:today(),caseId:c.id});draft={culprit:"",test:"",result:"",outcome:"inconclusive",notes:""}});toast("Test logged")}
function ttable(v,ts,wc){if(!ts.length)return"";return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th>${wc?"<th>Case</th>":""}<th>Culprit / test</th><th>Result</th><th>Outcome</th></tr></thead><tbody>`+[...ts].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<tr><td class="num">${t.date}</td>${wc?`<td>${esc((v.cases.find(c=>c.id===t.caseId)||{title:t.caseId}).title)}</td>`:""}<td><b>${esc(t.culprit)}</b><div class="sub">${esc(t.test)}</div></td><td>${esc(t.result)}${t.notes?`<div class="sub">${esc(t.notes)}</div>`:""}</td><td><span class="pill ${t.outcome==="pass"?"ok":t.outcome==="fail"?"bad":""}">${t.outcome}</span></td></tr>`).join("")+`</tbody></table></div>`}
// vehicles
function saveVehicle(){const f=k=>document.getElementById("vf"+k).value.trim();const err=document.getElementById("vferr");
 if(!f("year")||!f("make")||!f("model")){err.textContent="Year, make and model are required.";return}
 const vin=f("vin");if(vin&&!/^[A-HJ-NPR-Z0-9]{17}$/i.test(vin)&&!saveVehicle.warned){saveVehicle.warned=true;err.textContent="Heads up: a VIN is 17 characters (no I, O or Q). Tap Save again to keep it anyway.";return}saveVehicle.warned=false;
 const info={year:f("year"),make:f("make"),model:f("model"),trim:f("trim"),cab:f("cab"),bed:f("bed"),engine:f("engine"),vin:f("vin").toUpperCase(),buildDate:f("buildDate"),buildPlant:f("buildPlant"),mileage:f("mileage"),notes:f("notes")};
 set(()=>{if(editId&&editId!=="new"){const v=G.vehicles.find(x=>x.id===editId);v.info={...v.info,...info}}else{const id="v"+Date.now();G.vehicles.push({id,is22re:false,info:{...info,symptoms:[]},sections:mkSections(GENERIC_RAW),log:[],cases:[],tests:[],parts:[]});G.activeVehicleId=id}editId=null});toast("Vehicle saved")}
function updMileage(vid){const v=G.vehicles.find(x=>x.id===vid);const inp=document.getElementById("mi-"+vid);const n=parseInt((inp.value||"").replace(/[^0-9]/g,""),10);
 if(!n)return toast("Enter the current mileage");const prev=parseInt(String(v.info.mileage||"").replace(/[^0-9]/g,""),10)||0;
 if(prev&&n<prev&&!confirm(`${n.toLocaleString()} mi is lower than the last reading (${prev.toLocaleString()} mi). Save anyway?`))return;
 set(()=>{v.mileageLog=v.mileageLog||[];v.mileageLog.push({date:today(),miles:n});v.info.mileage=String(n);v.info.mileageDate=today()});toast("Mileage updated")}
function delVehicle(id){if(G.vehicles.length<2)return toast("You can't delete your only vehicle");const v=G.vehicles.find(x=>x.id===id);if(!confirm(`Delete ${vName(v)} and all its records? This can't be undone.`))return;
 set(()=>{G.vehicles=G.vehicles.filter(x=>x.id!==id);if(G.activeVehicleId===id)G.activeVehicleId=G.vehicles[0].id})}
function setActive(id){set(()=>{G.activeVehicleId=id;caseId=null});toast("Active: "+vName(V()))}
// import/export
function doImport(txt){let d;try{d=JSON.parse(txt)}catch(e){return toast("Could not read that JSON")}
 if(d.vehicles){if(!confirm("Replace your whole garage with this backup?"))return;if(Array.isArray(d.photos))importPhotos(d.photos);set(()=>{const ui=G.ui;G=migrate(d);G.ui=ui;if(!G.vehicles.some(v=>v.id===G.activeVehicleId))G.activeVehicleId=G.vehicles[0].id});return toast("Garage restored")}
 const veh=d.vehicleId&&G.vehicles.find(v=>v.id===d.vehicleId)||V();
 if(Array.isArray(d.specs)){G.specs=G.specs||[];d.specs.forEach(x=>{if(!G.specs.some(y=>y.id===x.id))G.specs.push({...x,vehicleId:veh.id,taskIds:x.taskIds||[]})})}
 if(Array.isArray(d.parts)&&d.sections&&d.log)veh.parts=d.parts;
 if(Array.isArray(d.intervals)){G.intervals=G.intervals||[];d.intervals.forEach(x=>{if(!G.intervals.some(y=>y.id===x.id))G.intervals.push({...x,vehicleId:veh.id})})}
 if(Array.isArray(d.inventory)){d.inventory.forEach(x=>{if(!G.inventory.some(y=>y.id===x.id))G.inventory.push({...x,vehicleId:x.vehicleId==='shared'?'shared':veh.id})})}
 if(Array.isArray(d.photos))importPhotos(d.photos,veh.id);
 const arr=Array.isArray(d)?d:Array.isArray(d.entries)?d.entries:(d.sections||d.cases||d.tests)?[]:[d];
 set(()=>{if(d.sections&&d.log){veh.sections=d.sections;veh.log=d.log;veh.cases=d.cases&&d.cases.length?d.cases:veh.cases;veh.tests=d.tests||[];if(d.info)veh.info={...veh.info,...d.info}}else{
  if(d.sections)veh.sections=d.sections.map(s=>({title:s.title,items:s.items.map(it=>({id:it.id,label:it.label,checked:!!it.checked,notes:it.notes||"",part:it.part||"",cost:it.cost?String(it.cost):"",updated:""}))}));
  if(Array.isArray(d.cases))d.cases.forEach(c=>{if(!veh.cases.some(x=>x.id===c.id))veh.cases.push({marks:{},...c})});
  if(Array.isArray(d.tests))veh.tests.push(...d.tests);}
  arr.forEach(e=>{const tv=e.vehicleId&&G.vehicles.find(v=>v.id===e.vehicleId)||veh;const id=e.itemId||e.id||"";const f=vItems(tv).find(x=>x.it.id===id);const it=f&&f.it;
   if(!it&&e.label){const t=e.section||"Added from conversation";let s=tv.sections.find(x=>x.title===t);if(!s){s={title:t,items:[]};tv.sections.push(s)}s.items.push({id:id||"x-"+Date.now()+"-"+tv.log.length,label:e.label,checked:!!e.checked,notes:e.notes||"",part:e.part||"",cost:e.cost?String(e.cost):"",updated:e.date||today()})}
   else if(it){if(e.checked!=null)it.checked=e.checked;if(e.notes!=null)it.notes=e.notes;if(e.part!=null)it.part=e.part;if(e.cost!=null)it.cost=String(e.cost);it.updated=e.date||today()}
   tv.log.push({date:e.date||today(),itemId:id,item:e.label||e.item||id,action:e.action||(e.checked?"Completed":"Imported"),part:e.part||"",cost:parseFloat(e.cost)||0})})});
 toast("Imported into "+vName(veh))}

 ${notesPanel(v,it)}<div style="padding-left:36px">${photoStrip(v.id,{type:"item",itemId:it.id})}</div><div style="padding-left:36px;margin-top:6px"><button class="btn sm danger" data-del="${it.id}" onclick="delTask('${v.id}','${it.id}')">Delete task</button></div>${partsPanel(v,it)}<div class="item-fields">${[["notes","Notes"],["part","Part #"],["cost","Cost $"]].map(([f,p])=>`<input class="input ${f}" aria-label="${p}" placeholder="${p}" value="${esc(it[f])}" data-id="${it.id}" ${f==="cost"?'inputmode="decimal"':""} onchange="upd('${v.id}',this.dataset.id,'${f}',this.value,true)">`).join("")}</div></div>`).join("")+`</div></section>`}).join("")+addTaskForm("ct",v.sections.map(s=>s.title))}

// ---------- Notes ----------
const openNotes={},noteDraft={};let noteEditing=null,offer=null;
const nid=()=>Math.random().toString(36).slice(2,10);
const findItem=(vid,id)=>{const v=G.vehicles.find(x=>x.id===vid);const f=v&&vItems(v).find(x=>x.it.id===id);return f&&f.it};
const fmtD=iso=>{try{const d=new Date(iso);return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}catch(e){return iso}};
function notesPanel(v,it){const k=v.id+"|"+it.id,ns=it.noteLog||[],open=openNotes[k];
 let h=`<div style="padding-left:36px;margin-top:6px"><button class="btn sm" data-notes="${it.id}" aria-expanded="${!!open}" onclick="toggleNotes('${v.id}','${it.id}')">Notes${ns.length?" ("+ns.length+")":""}</button>`;
 if(open){h+=`<div class="branch notes-panel" style="margin-top:8px">`+ns.map(n=>noteEditing===n.id?`<div class="note-item"><textarea class="input" id="ne-${n.id}" rows="3">${esc(n.text)}</textarea><div class="actions" style="margin-top:6px"><button class="btn sm primary" onclick="saveNoteEdit('${v.id}','${it.id}','${n.id}')">Save</button><button class="btn sm" onclick="noteEditing=null;render()">Cancel</button></div></div>`:
  `<div class="note-item" data-note="${n.id}"><div class="sub">Posted ${fmtD(n.postedAt)}${n.editedAt?" · edited "+fmtD(n.editedAt):""}</div><div class="note-text">${esc(n.text)}</div>${photoStrip(v.id,{type:"note",itemId:it.id,noteId:n.id})}<div class="actions" style="margin-top:6px"><button class="btn sm" onclick="noteEditing='${n.id}';render()">Edit</button><button class="btn sm danger" onclick="delNote('${v.id}','${it.id}','${n.id}')">Delete</button></div></div>`).join("")+
  `<div class="note-item"><label class="field"><span>New note</span><textarea class="input" id="nd-${it.id}" rows="3" oninput="noteDraft['${k}']=this.value" placeholder="e.g. Drain plug torque 27 ft-lb">${esc(noteDraft[k]||"")}</textarea></label><div class="actions" style="margin-top:8px"><button class="btn sm primary" data-post="${it.id}" onclick="postNote('${v.id}','${it.id}')">Post note</button></div>${offer&&offer.vid===v.id&&offer.taskId===it.id?offerHTML():""}</div></div>`}
 return h+`</div>`}
function toggleNotes(vid,id){const k=vid+"|"+id;openNotes[k]=!openNotes[k];render()}
function postNote(vid,id){const k=vid+"|"+id,t=(noteDraft[k]||"").trim();if(!t)return toast("Type a note first");
 set(()=>{const it=findItem(vid,id);it.noteLog=it.noteLog||[];it.noteLog.push({id:nid(),text:t,postedAt:new Date().toISOString()});noteDraft[k]="";const d=detectSpec(t);offer=d?{...d,vid,taskId:id}:null;if(!d)offer=null});toast("Note posted")}
function saveNoteEdit(vid,id,n){const t=document.getElementById("ne-"+n).value.trim();if(!t)return;set(()=>{const x=findItem(vid,id).noteLog.find(y=>y.id===n);x.text=t;x.editedAt=new Date().toISOString();noteEditing=null;const d=detectSpec(t);offer=d?{...d,vid,taskId:id}:null})}
function delNote(vid,id,n){if(!confirm("Delete this note?"))return;set(()=>{const it=findItem(vid,id);it.noteLog=it.noteLog.filter(y=>y.id!==n)});toast("Note deleted")}

 [/(?:°|deg(?:rees?)?)\s*btdc/,"° BTDC","Electrical"],[/(?:°|deg(?:rees?)?)/,"°","Other"],[/rpm/,"rpm","Other"],[/mm/,"mm","Other"],[/(?:in(?:ch(?:es)?)?|")/,"in","Other"]];
function detectSpec(text){const t=text.trim(),low=t.toLowerCase();
 const g=t.match(/\b(\d{1,2}W-?\d{2})\b/i);
 for(const [re,unit,topic] of UNITS){const m=low.match(new RegExp("(\\d+(?:\\.\\d+)?)\\s*(?:-\\s*)?"+re.source+"(?![a-z])"));if(m){let name=t.slice(0,m.index).replace(/[\s:=,-]+$/,"").replace(/\b(is|of|at|to|spec|=)\s*$/i,"").trim();
  let tp=topic;if(/gap/i.test(low))tp="Electrical";if(!name)name=t.slice(m.index+m[0].length).trim().slice(0,40);return {name:name.charAt(0).toUpperCase()+name.slice(1),value:m[1],unit,topic:tp}}}
 if(g)return {name:t.replace(g[0],"").replace(/[\s:=,-]+$/,"").trim()||"Engine oil",value:g[1].toUpperCase(),unit:"",topic:"Oil"};
 const pn=t.match(/\b([0-9A-Z]{3,6}-[0-9A-Z]{3,6}(?:-[0-9A-Z]{2,3})?|[0-9]{2}[A-Z][0-9]{6}[A-Z]?)\b/);
 if(pn)return {name:t.replace(pn[0],"").replace(/[\s:=,-]+$/,"").trim()||"Part number",value:pn[1],unit:"",topic:"Part numbers"};return null}

 if(!confirm(`Delete "${it.label}" from ${vName(v)}'s checklist? This removes the task (it is not the same as marking it complete). Past log entries are kept and labeled as a deleted task.`))return;
 set(()=>{undoBuf={vid,si,ii,it:JSON.parse(JSON.stringify(it)),secTitle:v.sections[si].title};v.sections[si].items.splice(ii,1);v.log.forEach(l=>{if(l.itemId===id&&!/deleted task/.test(l.item))l.item+=" (deleted task)"});v.log.push({date:today(),itemId:id,item:it.label+" (deleted task)",action:"Task deleted",part:"",cost:0})});
 const t=document.getElementById("toast");t.innerHTML='Task deleted <button class="btn sm" style="margin-left:8px;min-height:32px" onclick="undoDel()">Undo</button>';t.style.pointerEvents="auto";t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>{t.classList.remove("show");t.style.pointerEvents="none";undoBuf=null},6000)}
function undoDel(){if(!undoBuf)return;const u=undoBuf;undoBuf=null;set(()=>{const v=G.vehicles.find(x=>x.id===u.vid);let s=v.sections.find(x=>x.title===u.secTitle);if(!s){s={title:u.secTitle,items:[]};v.sections.push(s)}s.items.splice(Math.min(u.ii,s.items.length),0,u.it);v.log.forEach(l=>{if(l.itemId===u.it.id)l.item=l.item.replace(" (deleted task)","")});v.log=v.log.filter(l=>!(l.itemId===u.it.id&&l.action==="Task deleted"))});const t=document.getElementById("toast");t.style.pointerEvents="none";toast("Task restored")}
let partEdit=null;const openParts={};
function partsPanel(v,it){const ps=(v.parts||[]).filter(p=>p.taskId===it.id);const open=openParts[v.id+it.id];
 return `<div style="padding-left:36px;margin-top:6px"><button class="btn sm" aria-expanded="${!!open}" onclick="openParts['${v.id}${it.id}']=!openParts['${v.id}${it.id}'];render()">Parts${ps.length?" ("+ps.length+")":""}</button>${open?`<div class="branch" style="margin-top:8px">${ps.map(p=>partRow(v,p)).join("")}<div style="padding:10px 12px"><button class="btn sm" onclick="startPart('${v.id}','${it.id}')">Add part to this task</button></div></div>`:""}</div>`}
function partRow(v,p){const src=(p.source||"").split(" ; ").filter(Boolean);
 return `<div class="culprit part-row"><div class="culprit-top"><b>${esc(p.name)}</b><span>${p.user?'<span class="pill acc">User-entered</span> ':""}<span class="pill ${p.status==="verified"?"ok":"warn"}">${p.status==="verified"?"Verified":"Verify"}</span></span></div>
 ${p.oem?`<div><span class="sub">OEM${p.brand?" ("+esc(p.brand)+")":""}:</span> <span class="mono">${esc(p.oem)}</span></div>`:(p.brand?`<div class="sub">Brand: ${esc(p.brand)}</div>`:"")}
 ${p.xrefs?`<div><span class="sub">Cross-ref:</span> ${esc(p.xrefs)}</div>`:""}${p.spec?`<div class="sub">${esc(p.spec)}</div>`:""}${p.notes?`<div class="sub">Notes: ${esc(p.notes)}</div>`:""}
 <div class="actions" style="margin-top:6px">${p.lookup?`<a class="btn sm" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(p.lookup)}" target="_blank" rel="noopener">Look up</a>`:""}${src.map((s,i)=>`<a class="btn sm" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(s)}" target="_blank" rel="noopener">Source${src.length>1?" "+(i+1):""}</a>`).join("")}<button class="btn sm" onclick="startPart('${v.id}','',\'${p.id}\')">Edit</button></div></div>`}
function startPart(vid,taskId,pid){G.activeVehicleId=vid;partEdit=pid?{pid}:{taskId};G.ui.view="parts";save();render();window.scrollTo(0,0)}
function viewParts(){const v=V(),ps=v.parts||[];const byTask=t=>{const f=vItems(v).find(x=>x.it.id===t);return f?f.it.label:""};
 const p=partEdit&&partEdit.pid?ps.find(x=>x.id===partEdit.pid)||{}:{taskId:partEdit&&partEdit.taskId||""};
 const ver=ps.filter(x=>x.status==="verified").length;
 const form=`<section class="card" id="partForm"><div class="card-h"><h2>${p.id?"Edit part":"Add part"}</h2><span class="meta">Belongs to one vehicle</span></div><div class="card-b"><div class="form">
 <label class="field full"><span>Vehicle (required)</span>${vehSelect("pfveh",v.id)}</label>
 <label class="field full"><span>Task (optional)</span><select class="input" id="pftask"><option value="">Not linked to a task</option>${vItems(v).map(x=>`<option value="${x.it.id}" ${x.it.id===p.taskId?"selected":""}>${esc(x.sec)} · ${esc(x.it.label)}</option>`).join("")}</select></label>
 ${[["name","Part name *"],["brand","Brand"],["oem","OEM part number"],["xrefs","Aftermarket cross-references"],["spec","Spec (capacity / type / gap)"],["source","Source URL(s), separate with ' ; '"],["lookup","Look-up URL"],["notes","Notes"]].map(([k,l])=>`<label class="field ${k==="name"||k==="brand"?"":"full"}"><span>${l}</span><input class="input" id="pf${k}" value="${esc(p[k]||"")}"></label>`).join("")}
 <label class="field"><span>Status</span><select class="input" id="pfstatus"><option value="verify" ${p.status!=="verified"?"selected":""}>Verify</option><option value="verified" ${p.status==="verified"?"selected":""}>Verified (has source)</option></select></label>
 <div class="field full"><div class="err" id="pferr" role="alert"></div><div class="actions"><button class="btn primary" id="pfsave" onclick="savePart('${p.id||""}')">Save part</button>${p.id?`<button class="btn danger" onclick="delPart('${p.id}')">Delete</button>`:""}${partEdit?`<button class="btn" onclick="partEdit=null;render()">Cancel</button>`:""}</div></div></div></div></section>`;
 const groups={};ps.forEach(x=>{const k=byTask(x.taskId)||"Other parts";(groups[k]=groups[k]||[]).push(x)});
 return `<div class="stats"><div class="stat"><b>${ps.length}</b><span>Parts</span></div><div class="stat"><b>${ver}</b><span>Verified</span></div><div class="stat"><b>${ps.length-ver}</b><span>To verify</span></div></div>`+
 (partEdit?form:"")+Object.entries(groups).map(([k,list])=>`<section class="card"><div class="card-h"><h2>${esc(k)}</h2><span class="meta">${list.length}</span></div>${list.map(x=>partRow(v,x)).join("")}</section>`).join("")+
 (partEdit?"":`<div class="actions" style="margin-bottom:16px"><button class="btn primary" id="addPart" onclick="partEdit={taskId:''};render()">Add part</button></div>`)+
 `<p class="sub">Numbers marked Verified have a source link. Anything marked Verify needs confirming by VIN before ordering.</p>`}
function savePart(pid){const g=k=>document.getElementById("pf"+k).value.trim();const err=document.getElementById("pferr");const vid=g("veh");
 if(!vid||!G.vehicles.some(v=>v.id===vid)){err.textContent="Select a vehicle from your garage before saving.";return}
 if(!g("name")){err.textContent="Enter a part name.";return}
 const data={name:g("name"),brand:g("brand"),oem:g("oem"),xrefs:g("xrefs"),spec:g("spec"),source:g("source"),lookup:g("lookup"),notes:g("notes"),status:g("status"),taskId:vid===G.activeVehicleId?g("task"):""};
 if(data.status==="verified"&&!data.source){err.textContent="Add a source URL to mark a part as verified.";return}
 set(()=>{const from=V();if(pid){const i=from.parts.findIndex(x=>x.id===pid);const old=from.parts[i];from.parts.splice(i,1);G.vehicles.find(v=>v.id===vid).parts.push({...old,...data})}else G.vehicles.find(v=>v.id===vid).parts.push(P({...data,user:true}));partEdit=null});toast("Part saved")}
function delPart(pid){if(!confirm("Delete this part?"))return;set(()=>{const v=V();v.parts=v.parts.filter(x=>x.id!==pid);partEdit=null})}
</script></body></html>
